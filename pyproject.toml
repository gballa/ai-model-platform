[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-core"
version = "1.0.0"
description = "Three-Layer Hybrid Technical Intelligence Platform — Model Routing, 5-Stage Post-Training (CPT/SFT/MOPD/GRPO+RLVR), 6-Agent Checkpointed Execution, MCP Tool Suite, Firecracker Sandboxing, and Bitemporal Memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Technical Intelligence Platform Architecture Team"}
]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx>=0.30.0", "mlx-lm>=0.30.0", "huggingface-hub>=0.26.0"]
train = ["torch>=2.5.0", "transformers>=4.48.0", "peft>=0.14.0", "trl>=0.14.0"]
rag = ["numpy>=2.0.0"]
vision = ["pillow>=11.0.0", "pypdf>=5.0.0"]
forensics = ["mvt>=2.5.0"]
agy = ["google-antigravity>=0.1.0"]
all = [
    "mlx>=0.30.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.30.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface-hub>=0.26.0",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "google-antigravity>=0.1.0",
]

[project.scripts]
platform-cli = "platform_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
